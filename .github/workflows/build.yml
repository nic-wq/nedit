name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v*'
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nedit-linux
            asset_name: nedit
          - os: windows-latest
            artifact_name: nedit-windows
            asset_name: nedit.exe

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev musl-tools musl-dev

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.os == 'ubuntu-latest' && 'x86_64-unknown-linux-musl' || '' }}

    - name: Build
      env:
        CC_x86_64_unknown_linux_musl: musl-gcc
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/nedit target/release/nedit
        else
          cargo build --release
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          target/release/${{ matrix.asset_name }}

  release:
    name: Release
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: nedit-linux
          path: ./linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: nedit-windows
          path: ./windows

      - name: Prepare Binaries
        run: |
          mv ./linux/nedit ./nedit_linux
          mv ./windows/nedit.exe ./nedit_windows.exe
          chmod +x ./nedit_linux

      - name: Release Nightly
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: "Automated Real-time build. Contains the latest commits from the main branch. Use at your own risk."
          prerelease: true
          files: |
            nedit_linux
            nedit_windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            nedit_linux
            nedit_windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
